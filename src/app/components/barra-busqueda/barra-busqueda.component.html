<form class="barra" [formGroup]="formulario" (submit)="$event.preventDefault(); ejecutarBuscar()" novalidate>
  <div class="fila principal">
    <div class="campo">
      <label class="etiqueta" for="ciudad">Dónde</label>
      <input id="ciudad" type="text" formControlName="ciudad" placeholder="Ciudad" />
    </div>

    <div class="campo campo-fechas">
      <span class="etiqueta">Fechas</span>
      <div class="fechas">
        <input id="llegada" type="date" formControlName="llegada" aria-label="Fecha de llegada" />
        <input id="salida" type="date" formControlName="salida" aria-label="Fecha de salida" />
      </div>
    </div>

    <div class="campo">
      <label class="etiqueta" for="huespedes">Quién</label>
      <input id="huespedes" type="number" min="1" formControlName="huespedes" placeholder="Huéspedes" />
    </div>

    <button type="button" class="boton-limpiar" aria-label="Limpiar filtros" (click)="limpiar()">✕</button>

    @if (mostrarBotonBuscar()) {
      <button type="submit" class="boton-buscar" aria-label="Buscar alojamientos">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="texto-buscar">Buscar</span>
      </button>
    }
  </div>

  @if (erroresFechas().length > 0) {
    <div class="errores-fechas" role="alert">
      @for (error of erroresFechas(); track error) {
        <p class="error-fecha">{{ error }}</p>
      }
    </div>
  }

  @if (mostrarSecundarios()) {
    <div class="fila secundaria">
      <div class="campo">
        <label class="etiqueta" for="tipo">Tipo</label>
        <select id="tipo" formControlName="tipo">
          <option value="">Todos</option>
          @for (tipo of tipos(); track tipo) {
            <option [value]="tipo">{{ tipo }}</option>
          }
        </select>
      </div>

      <div class="campo">
        <label class="etiqueta" for="precioMax">Precio máximo</label>
        <input id="precioMax" type="number" min="0" formControlName="precioMax" placeholder="COP por noche" />
      </div>
    </div>
  }
</form>
