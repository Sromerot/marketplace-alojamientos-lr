<section class="pagina">
  <h4 class="titulo">Alojamientos</h4>

  <app-barra-busqueda
    [tipos]="tipos()"
    [filtrosIniciales]="filtros()"
    (filtrosChange)="actualizarFiltros($event)"
  />

  <p class="contador">{{ resultados().length }} alojamientos encontrados</p>

  <div class="layout-catalogo">
    <div class="columna-alojamientos">
      @if (resultados().length > 0) {
        <div class="grilla">
          @for (alojamiento of resultados(); track alojamiento.id) {
            <app-alojamiento-card [alojamiento]="alojamiento" />
          }
        </div>
      } @else if (rangoFechas(); as rango) {
        <app-alerta-mensaje
          tipo="info"
          [mensaje]="
            'No hay hospedajes disponibles del ' +
            (rango.llegada | date: 'd MMM y') +
            ' al ' +
            (rango.salida | date: 'd MMM y') +
            '.'
          "
          textoBoton="Limpiar filtros"
          (accion)="limpiarFiltros()"
        />
      } @else {
        <app-alerta-mensaje
          tipo="info"
          mensaje="No encontramos alojamientos con esos filtros."
          textoBoton="Limpiar filtros"
          (accion)="limpiarFiltros()"
        />
      }
    </div>

    <aside class="columna-mapa">
      <app-mapa-decorativo />
    </aside>
  </div>
</section>
